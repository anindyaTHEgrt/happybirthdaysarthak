<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Pixel Racing Helmet (Ferrari Red + Gold) -->
  <rect x="14" y="10" width="36" height="38" fill="#111111" rx="8"/>
  <rect x="16" y="12" width="32" height="34" fill="#C91D28" rx="6"/>
  <!-- Top Aerodynamic Fin & Gold Racing Stripe -->
  <rect x="28" y="10" width="8" height="30" fill="#E9C55B"/>
  <rect x="18" y="14" width="8" height="4" fill="#F0535E"/>
  <!-- Visor -->
  <rect x="30" y="22" width="22" height="12" fill="#111111"/>
  <rect x="32" y="24" width="18" height="8" fill="#444444"/>
  <rect x="34" y="24" width="10" height="3" fill="#E9C55B"/>
  <!-- Chin bar -->
  <rect x="26" y="34" width="22" height="10" fill="#9B131C"/>
  <rect x="32" y="38" width="10" height="2" fill="#111111"/> <!-- Air vents -->
</svg>

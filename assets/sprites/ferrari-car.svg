<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Original 2D Pixel Open-Wheel Racing Car (Ferrari Red) -->
  
  <!-- Rear Wing -->
  <rect x="10" y="15" width="20" height="8" fill="#111111"/>
  <rect x="22" y="23" width="8" height="25" fill="#111111"/>
  <rect x="8" y="15" width="4" height="20" fill="#C91D28"/>

  <!-- Main Body Chassis (Red) -->
  <rect x="30" y="32" width="160" height="22" fill="#C91D28"/>
  <rect x="50" y="26" width="90" height="10" fill="#C91D28"/>
  <!-- Highlight on top body -->
  <rect x="55" y="26" width="70" height="3" fill="#F0535E"/>
  
  <!-- Cockpit & Halo -->
  <rect x="90" y="14" width="45" height="14" fill="#111111"/>
  <rect x="95" y="18" width="35" height="10" fill="#222222"/>
  <!-- Driver Helmet (Gold/Yellow with Red Visor) -->
  <rect x="106" y="16" width="16" height="12" fill="#E9C55B"/>
  <rect x="114" y="20" width="8" height="4" fill="#C91D28"/>

  <!-- Air Intake behind helmet -->
  <rect x="80" y="12" width="12" height="16" fill="#C91D28"/>
  <rect x="82" y="14" width="8" height="6" fill="#111111"/>

  <!-- Front Nose Cone -->
  <polygon points="190,36 225,44 190,48" fill="#C91D28"/>
  <rect x="190" y="38" width="25" height="8" fill="#C91D28"/>
  <rect x="215" y="42" width="15" height="4" fill="#C91D28"/>

  <!-- Front Wing -->
  <rect x="210" y="46" width="25" height="6" fill="#111111"/>
  <rect x="230" y="40" width="6" height="14" fill="#C91D28"/>

  <!-- Wheels / Tyres (Chunky Pixel Rubber) -->
  <!-- Rear Wheel -->
  <rect x="38" y="28" width="32" height="36" fill="#0D0D0D"/>
  <rect x="44" y="34" width="20" height="24" fill="#222222"/>
  <rect x="50" y="40" width="8" height="12" fill="#E9C55B"/> <!-- Gold Rim Center -->
  <rect x="38" y="28" width="32" height="3" fill="#C91D28"/> <!-- Red Tyre Stripe -->

  <!-- Front Wheel -->
  <rect x="168" y="32" width="28" height="32" fill="#0D0D0D"/>
  <rect x="173" y="37" width="18" height="22" fill="#222222"/>
  <rect x="179" y="43" width="6" height="10" fill="#E9C55B"/> <!-- Gold Rim Center -->
  <rect x="168" y="32" width="28" height="3" fill="#C91D28"/> <!-- Red Tyre Stripe -->

  <!-- Racing Number 25 on Sidepod -->
  <rect x="135" y="36" width="16" height="12" fill="#FFFFFF"/>
  <text x="143" y="46" fill="#C91D28" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">25</text>

  <!-- Speed Dust / Exhaust spark -->
  <rect x="2" y="40" width="8" height="4" fill="#E9C55B" opacity="0.8"/>
  <rect x="6" y="35" width="6" height="3" fill="#FFA500" opacity="0.6"/>
</svg>

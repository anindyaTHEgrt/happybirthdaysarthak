<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Baking & Sweet Treats Scene -->
  <rect width="400" height="300" fill="#FFF2E2"/>
  <!-- Kitchen tile wall -->
  <rect x="0" y="0" width="400" height="180" fill="#F4ECE1"/>
  <line x1="0" y1="45" x2="400" y2="45" stroke="#E2D4C3" stroke-width="2"/>
  <line x1="0" y1="90" x2="400" y2="90" stroke="#E2D4C3" stroke-width="2"/>
  <line x1="0" y1="135" x2="400" y2="135" stroke="#E2D4C3" stroke-width="2"/>
  
  <!-- Wooden Kitchen Counter -->
  <rect x="0" y="180" width="400" height="120" fill="#8D5B4C"/>
  <rect x="0" y="170" width="400" height="15" fill="#D7CCC8"/>

  <!-- Pixel Cake on Stand -->
  <rect x="170" y="155" width="60" height="15" fill="#EEEEEE"/>
  <rect x="190" y="170" width="20" height="10" fill="#BDBDBD"/>
  <!-- Cake layers -->
  <rect x="160" y="100" width="80" height="55" fill="#6D4C41"/>
  <rect x="155" y="95" width="90" height="12" fill="#F8BBD0"/> <!-- Frosting -->
  <rect x="165" y="107" width="10" height="10" fill="#F8BBD0"/>
  <rect x="195" y="107" width="10" height="12" fill="#F8BBD0"/>
  <rect x="225" y="107" width="10" height="8" fill="#F8BBD0"/>
  <!-- Strawberries / Cherries on top -->
  <rect x="175" y="85" width="10" height="10" fill="#C91D28"/>
  <rect x="195" y="82" width="10" height="12" fill="#C91D28"/>
  <rect x="215" y="85" width="10" height="10" fill="#C91D28"/>

  <!-- Baking tools: Whisk, bowl, flour sack -->
  <rect x="70" y="130" width="50" height="40" fill="#42A5F5"/> <!-- Blue bowl -->
  <rect x="65" y="125" width="60" height="6" fill="#1E88E5"/>
  <rect x="300" y="120" width="40" height="50" fill="#E9D9B5"/> <!-- Flour sack -->
  <text x="320" y="150" fill="#5D4037" font-family="monospace" font-size="10" text-anchor="middle">FLOUR</text>

  <!-- Chef Hat -->
  <rect x="180" y="40" width="40" height="28" fill="#FFFFFF"/>
  <circle cx="185" cy="40" r="14" fill="#FFFFFF"/>
  <circle cx="200" cy="32" r="16" fill="#FFFFFF"/>
  <circle cx="215" cy="40" r="14" fill="#FFFFFF"/>
  <rect x="178" y="65" width="44" height="6" fill="#E0E0E0"/>

  <!-- Decorative text tag at bottom -->
  <rect x="10" y="10" width="130" height="24" fill="rgba(0,0,0,0.6)" rx="4"/>
  <text x="75" y="26" fill="#E9D9B5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PHOTO #3 [PREVIEW]</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Warm Minecraft Pixel Photo: Sunset Hill & Couple Silhouette -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7E5F"/>
      <stop offset="50%" stop-color="#FEB47B"/>
      <stop offset="100%" stop-color="#FFECCC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skyGrad)"/>
  
  <!-- Pixel Sun -->
  <rect x="280" y="40" width="48" height="48" fill="#FFF3A3"/>
  <rect x="288" y="48" width="32" height="32" fill="#FFFFFF"/>
  
  <!-- Pixel Clouds -->
  <rect x="40" y="50" width="80" height="20" fill="rgba(255,255,255,0.7)"/>
  <rect x="60" y="40" width="50" height="10" fill="rgba(255,255,255,0.7)"/>
  <rect x="180" y="80" width="90" height="18" fill="rgba(255,255,255,0.6)"/>

  <!-- Distant pixel mountains -->
  <polygon points="0,220 80,160 160,220" fill="#8E44AD" opacity="0.3"/>
  <polygon points="120,220 220,140 320,220" fill="#8E44AD" opacity="0.4"/>
  <polygon points="260,220 340,150 400,200 400,220" fill="#8E44AD" opacity="0.35"/>

  <!-- Grass Hill (Block style) -->
  <rect x="0" y="210" width="400" height="90" fill="#38733E"/>
  <rect x="0" y="200" width="400" height="10" fill="#4D9B56"/>
  <rect x="20" y="200" width="40" height="4" fill="#6AB873"/>
  <rect x="120" y="200" width="60" height="4" fill="#6AB873"/>
  <rect x="240" y="200" width="50" height="4" fill="#6AB873"/>
  <rect x="340" y="200" width="40" height="4" fill="#6AB873"/>

  <!-- Pixel Couple Holding Hands on the Hill -->
  <!-- Character 1: Sarthak (Ferrari Red shirt) -->
  <rect x="175" y="146" width="16" height="16" fill="#D4A373"/> <!-- Head -->
  <rect x="173" y="142" width="20" height="8" fill="#2C1B18"/> <!-- Hair -->
  <rect x="173" y="162" width="20" height="24" fill="#C91D28"/> <!-- Red Shirt -->
  <rect x="175" y="186" width="7" height="22" fill="#1A252C"/> <!-- Pants L -->
  <rect x="186" y="186" width="7" height="22" fill="#1A252C"/> <!-- Pants R -->
  <rect x="173" y="206" width="9" height="6" fill="#000000"/> <!-- Shoe L -->
  <rect x="186" y="206" width="9" height="6" fill="#000000"/> <!-- Shoe R -->

  <!-- Character 2: Girlfriend (Cozy Emerald / Pastel Sweater) -->
  <rect x="205" y="150" width="15" height="15" fill="#E8C5A0"/> <!-- Head -->
  <rect x="202" y="145" width="21" height="18" fill="#4A2810"/> <!-- Long Hair -->
  <rect x="203" y="165" width="18" height="22" fill="#2E8B57"/> <!-- Green Sweater -->
  <rect x="204" y="187" width="7" height="21" fill="#2B3A42"/> <!-- Jeans L -->
  <rect x="213" y="187" width="7" height="21" fill="#2B3A42"/> <!-- Jeans R -->
  <rect x="203" y="206" width="8" height="5" fill="#E9C55B"/> <!-- Shoes -->
  <rect x="213" y="206" width="8" height="5" fill="#E9C55B"/>

  <!-- Held hands bridge -->
  <rect x="193" y="172" width="10" height="6" fill="#D4A373"/>

  <!-- Pixel Heart above them -->
  <path d="M198 126 h4 v4 h-4 z M194 122 h4 v4 h-4 z M202 122 h4 v4 h-4 z M190 126 h4 v6 h-4 z M206 126 h4 v6 h-4 z M194 132 h4 v4 h-4 z M202 132 h4 v4 h-4 z M198 136 h4 v4 h-4 z" fill="#E63946"/>

  <!-- Decorative text tag at bottom -->
  <rect x="10" y="10" width="130" height="24" fill="rgba(0,0,0,0.6)" rx="4"/>
  <text x="75" y="26" fill="#E9D9B5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PHOTO #1 [PREVIEW]</text>
</svg>

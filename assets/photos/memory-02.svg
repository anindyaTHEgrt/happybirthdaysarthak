<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Minecraft Diamond Mining & Gaming Night -->
  <rect width="400" height="300" fill="#1C1B24"/>
  <!-- Stone cave background with glow -->
  <rect x="0" y="0" width="400" height="300" fill="#2B2936"/>
  <!-- Cobblestone block textures -->
  <rect x="30" y="30" width="60" height="60" fill="#444154"/>
  <rect x="90" y="30" width="60" height="60" fill="#383547"/>
  <rect x="150" y="30" width="60" height="60" fill="#444154"/>
  <rect x="210" y="30" width="60" height="60" fill="#383547"/>
  <rect x="270" y="30" width="60" height="60" fill="#444154"/>
  <rect x="330" y="30" width="60" height="60" fill="#383547"/>

  <!-- Glowing Redstone / Diamond Ore Blocks -->
  <rect x="60" y="140" width="50" height="50" fill="#383547"/>
  <rect x="70" y="150" width="12" height="12" fill="#55FFFF"/>
  <rect x="88" y="165" width="10" height="10" fill="#55FFFF"/>
  
  <rect x="290" y="160" width="50" height="50" fill="#383547"/>
  <rect x="300" y="170" width="14" height="14" fill="#FF5555"/>
  <rect x="320" y="185" width="8" height="8" fill="#FF5555"/>

  <!-- Minecraft Lantern with warm glow -->
  <circle cx="200" cy="110" r="50" fill="#FFA500" opacity="0.15"/>
  <rect x="194" y="90" width="12" height="6" fill="#111111"/>
  <rect x="192" y="96" width="16" height="22" fill="#FFB347"/>
  <rect x="196" y="100" width="8" height="14" fill="#FFFFFF"/>

  <!-- Dual gaming monitors with cute pixel game on screen -->
  <rect x="130" y="160" width="140" height="85" fill="#111111"/>
  <rect x="135" y="165" width="130" height="75" fill="#1A3B5C"/>
  <rect x="150" y="180" width="30" height="30" fill="#4D9B56"/>
  <rect x="210" y="185" width="20" height="20" fill="#C91D28"/>
  <text x="200" y="215" fill="#55FFFF" font-family="monospace" font-size="10" text-anchor="middle">LEVEL 25 SERVER</text>
  <!-- Keyboard & desk -->
  <rect x="90" y="245" width="220" height="15" fill="#3E2723"/>
  <rect x="140" y="240" width="80" height="10" fill="#616161"/>
  <rect x="235" y="241" width="14" height="10" fill="#C91D28"/> <!-- Red mouse -->

  <!-- Decorative text tag at bottom -->
  <rect x="10" y="10" width="130" height="24" fill="rgba(0,0,0,0.6)" rx="4"/>
  <text x="75" y="26" fill="#E9D9B5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PHOTO #2 [PREVIEW]</text>
</svg>

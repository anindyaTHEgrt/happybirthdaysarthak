<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Closed Pixel Wooden Chest -->
  <!-- Outer black outline -->
  <rect x="6" y="10" width="52" height="46" fill="#140D07"/>
  
  <!-- Lid Section -->
  <rect x="8" y="12" width="48" height="16" fill="#8D5524"/>
  <rect x="10" y="14" width="44" height="4" fill="#B2743C"/>
  <rect x="8" y="24" width="48" height="4" fill="#583416"/>
  
  <!-- Bottom Box Section -->
  <rect x="8" y="28" width="48" height="26" fill="#8D5524"/>
  <rect x="10" y="30" width="44" height="4" fill="#B2743C"/>
  <rect x="8" y="50" width="48" height="4" fill="#583416"/>

  <!-- Corner Iron Rivets/Reinforcements -->
  <rect x="8" y="12" width="6" height="42" fill="#3A3836"/>
  <rect x="50" y="12" width="6" height="42" fill="#3A3836"/>
  
  <!-- Center Iron Latch / Lock -->
  <rect x="28" y="22" width="8" height="12" fill="#0E0D0C"/>
  <rect x="30" y="24" width="4" height="8" fill="#BDBDBD"/>
  <rect x="31" y="27" width="2" height="3" fill="#333333"/>
</svg>

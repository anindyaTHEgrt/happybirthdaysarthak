<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- F1 Sundays & Ferrari Screams Scene -->
  <rect width="400" height="300" fill="#111111"/>
  
  <!-- Grandstand & Curbs (Red and White) -->
  <rect x="0" y="240" width="400" height="60" fill="#222222"/> <!-- Asphalt Track -->
  <!-- Checkered curb -->
  <g fill="#FFFFFF">
    <rect x="0" y="230" width="30" height="10"/>
    <rect x="60" y="230" width="30" height="10"/>
    <rect x="120" y="230" width="30" height="10"/>
    <rect x="180" y="230" width="30" height="10"/>
    <rect x="240" y="230" width="30" height="10"/>
    <rect x="300" y="230" width="30" height="10"/>
    <rect x="360" y="230" width="30" height="10"/>
  </g>
  <g fill="#C91D28">
    <rect x="30" y="230" width="30" height="10"/>
    <rect x="90" y="230" width="30" height="10"/>
    <rect x="150" y="230" width="30" height="10"/>
    <rect x="210" y="230" width="30" height="10"/>
    <rect x="270" y="230" width="30" height="10"/>
    <rect x="330" y="230" width="30" height="10"/>
    <rect x="390" y="230" width="30" height="10"/>
  </g>

  <!-- Big TV Screen in living room watching Grand Prix -->
  <rect x="70" y="40" width="260" height="160" fill="#222222" rx="4"/>
  <rect x="80" y="50" width="240" height="140" fill="#0D1B2A"/>
  
  <!-- Race Car on TV Screen -->
  <!-- Red open-wheeler car sprite on TV -->
  <rect x="130" y="125" width="130" height="20" fill="#C91D28"/>
  <rect x="180" y="112" width="40" height="15" fill="#C91D28"/> <!-- Cockpit -->
  <rect x="195" y="108" width="15" height="10" fill="#E9C55B"/> <!-- Helmet -->
  <rect x="120" y="118" width="20" height="8" fill="#111111"/> <!-- Rear wing -->
  <rect x="250" y="132" width="25" height="8" fill="#111111"/> <!-- Front wing -->
  <rect x="140" y="138" width="24" height="22" fill="#000000"/> <!-- Rear tyre -->
  <rect x="235" y="138" width="24" height="22" fill="#000000"/> <!-- Front tyre -->
  <!-- Speed lines -->
  <line x1="90" y1="120" x2="115" y2="120" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="85" y1="135" x2="118" y2="135" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="95" y1="148" x2="125" y2="148" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Leaderboard on TV -->
  <rect x="85" y="55" width="70" height="30" fill="rgba(0,0,0,0.7)"/>
  <text x="90" y="68" fill="#E9C55B" font-family="monospace" font-size="11" font-weight="bold">P1 SARTHAK</text>
  <text x="90" y="80" fill="#00FF00" font-family="monospace" font-size="9">INTERVAL: LEADER</text>

  <!-- Chequered flag on the side -->
  <rect x="330" y="20" width="4" height="80" fill="#A8A8A8"/>
  <rect x="334" y="20" width="10" height="10" fill="#000000"/>
  <rect x="344" y="20" width="10" height="10" fill="#FFFFFF"/>
  <rect x="334" y="30" width="10" height="10" fill="#FFFFFF"/>
  <rect x="344" y="30" width="10" height="10" fill="#000000"/>
  <rect x="334" y="40" width="10" height="10" fill="#000000"/>
  <rect x="344" y="40" width="10" height="10" fill="#FFFFFF"/>

  <!-- Decorative text tag at bottom -->
  <rect x="10" y="10" width="130" height="24" fill="rgba(0,0,0,0.6)" rx="4"/>
  <text x="75" y="26" fill="#E9D9B5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PHOTO #4 [PREVIEW]</text>
</svg>

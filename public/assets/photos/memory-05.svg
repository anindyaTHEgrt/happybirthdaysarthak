<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" shape-rendering="crispEdges">
  <!-- Everyday Magic / Coffee Date / Cozy Cafe -->
  <rect width="400" height="300" fill="#2E1C14"/>
  <!-- Warm cafe lighting and wooden background -->
  <rect x="0" y="0" width="400" height="190" fill="#42281D"/>
  
  <!-- Warm window showing starry night -->
  <rect x="50" y="30" width="100" height="110" fill="#0C1427"/>
  <rect x="46" y="26" width="108" height="118" fill="none" stroke="#6D4330" stroke-width="4"/>
  <circle cx="80" cy="60" r="1.5" fill="#FFFFFF"/>
  <circle cx="120" cy="50" r="1" fill="#FFFFFF"/>
  <circle cx="100" cy="90" r="1.5" fill="#FFFFFF"/>
  <circle cx="130" cy="110" r="1" fill="#FFFFFF"/>
  <!-- Crescent moon in window -->
  <circle cx="115" cy="55" r="10" fill="#FFF275"/>
  <circle cx="119" cy="53" r="8" fill="#0C1427"/>

  <!-- Fairy lights hanging -->
  <path d="M0 20 Q 200 45 400 20" fill="none" stroke="#22150F" stroke-width="2"/>
  <rect x="50" y="24" width="6" height="6" fill="#FFEAA7"/>
  <rect x="110" y="29" width="6" height="6" fill="#FF7675"/>
  <rect x="180" y="32" width="6" height="6" fill="#74B9FF"/>
  <rect x="250" y="31" width="6" height="6" fill="#FFEAA7"/>
  <rect x="320" y="27" width="6" height="6" fill="#55EFC4"/>

  <!-- Round Cafe Table -->
  <rect x="0" y="190" width="400" height="110" fill="#24140D"/>
  <ellipse cx="200" cy="220" rx="140" ry="40" fill="#8D5537"/>
  <ellipse cx="200" cy="216" rx="136" ry="36" fill="#A86A46"/>

  <!-- Two Coffee Mugs with Latte Art Heart -->
  <!-- Mug 1: Ferrari Red -->
  <rect x="160" y="195" width="28" height="26" fill="#C91D28"/>
  <rect x="154" y="202" width="6" height="12" fill="none" stroke="#C91D28" stroke-width="3"/>
  <!-- Latte art heart -->
  <ellipse cx="174" cy="195" rx="12" ry="5" fill="#FFF8EE"/>
  <path d="M174 195 C 172 193, 170 193, 170 195 C 170 197, 174 199, 174 199 C 174 199, 178 197, 178 195 C 178 193, 176 193, 174 195 Z" fill="#C91D28"/>

  <!-- Mug 2: Cream / Gold -->
  <rect x="210" y="195" width="28" height="26" fill="#E9C55B"/>
  <rect x="238" y="202" width="6" height="12" fill="none" stroke="#E9C55B" stroke-width="3"/>
  <ellipse cx="224" cy="195" rx="12" ry="5" fill="#FFF8EE"/>
  <path d="M224 195 C 222 193, 220 193, 220 195 C 220 197, 224 199, 224 199 C 224 199, 228 197, 228 195 C 228 193, 226 193, 224 195 Z" fill="#8D5537"/>

  <!-- Steam rising -->
  <path d="M172 185 Q 170 175 174 165" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <path d="M222 185 Q 224 175 220 165" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- Decorative text tag at bottom -->
  <rect x="10" y="10" width="130" height="24" fill="rgba(0,0,0,0.6)" rx="4"/>
  <text x="75" y="26" fill="#E9D9B5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">PHOTO #5 [PREVIEW]</text>
</svg>
